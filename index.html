<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <meta
            name="description"
            content="A playful random fruit picker."
        />

        <link rel="stylesheet" href="./style.css" />

        <title>Fruit Picker</title>
    </head>

    <body>
        <main class="page">
            <section class="fruit-card">
                <p class="eyebrow">Feeling fruity?</p>

                <h1>Pick a random fruit</h1>

                <p class="description">
                    Press the button and let chance choose your next
                    fruity favorite.
                </p>

                <div
                    class="fruit-display"
                    id="fruit-display"
                    aria-live="polite"
                >
                    <span
                        class="fruit-emoji"
                        id="fruit-emoji"
                        aria-hidden="true"
                    >
                        🍓
                    </span>

                    <p class="fruit-name" id="fruit-name">
                        Ready when you are
                    </p>
                </div>

                <button
                    class="fruit-button"
                    id="fruit-button"
                    type="button"
                >
                    Pick a fruit
                    <span aria-hidden="true">→</span>
                </button>

                <p class="keyboard-hint">
                    You can also press Enter or Space.
                </p>
            </section>
        </main>

        <script type="module" src="./script.js"></script>
    </body>
</html>
